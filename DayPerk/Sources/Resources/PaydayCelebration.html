</div><script>
(async function(){
// 子场景继承父场景的声明变量，避免只读到子场景自己的空变量表。
const locale=getComputedStyle(document.getElementById('celebration-title')).getPropertyValue('--language').trim()||'zh-Hans';
const messages={"zh-Hans": "发工资啦！", "zh-Hant": "發薪水啦！", "en": "Payday!", "fr": "Jour de paie !", "de": "Zahltag!", "ja": "給料日！", "ko": "월급날!"};
const lines={"zh-Hans": ["发工资啦！"], "zh-Hant": ["發薪水啦！"], "en": ["Payday!"], "fr": ["Jour", "de paie !"], "de": ["Zahltag!"], "ja": ["給料日！"], "ko": ["월급날!"]};
// 每个字是独立 SVG 轮廓，渲染时不依赖字库或文字排版。
const asset=window.PaydayGlyphs[locale]||window.PaydayGlyphs['zh-Hans'];
const message=messages[locale]||messages['zh-Hans'];
const heading=document.getElementById('celebration-title');
heading.lang=locale;
const segmenter=new Intl.Segmenter(locale,{granularity:'grapheme'});
const rows=(lines[locale]||lines['zh-Hans']).map(line=>[...segmenter.segment(line)].map(item=>item.segment));
let fontSize=locale.startsWith('zh')?138:110;
const letterMargins=locale==='zh-Hant'?10:locale.startsWith('zh')?4:2;
